<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <title>Yeelight Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10151d;
      color: #edf2f7;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input { font: inherit; }
    button {
      border: 1px solid #344153;
      border-radius: 10px;
      padding: 10px 14px;
      color: #edf2f7;
      background: #202b39;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    button:hover { background: #2b394b; border-color: #71839b; }
    button:active { transform: translateY(1px); }
    button.primary { color: #10151d; background: #a9e34b; border-color: #a9e34b; font-weight: 700; }
    button.primary:hover { background: #c4f06f; }
    button:disabled { opacity: .55; cursor: wait; }
    input {
      min-width: 0;
      border: 1px solid #344153;
      border-radius: 10px;
      padding: 11px 12px;
      color: #edf2f7;
      background: #131b25;
    }
    input:focus { outline: 2px solid #a9e34b; outline-offset: 1px; }
    .shell { width: min(100% - 32px, 1040px); margin: 0 auto; padding: 30px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #a9e34b; color: #10151d; font-size: 23px; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); letter-spacing: -.04em; }
    .subtitle { margin: 4px 0 0; color: #93a1b3; font-size: 14px; }
    .connection { display: inline-flex; align-items: center; gap: 8px; color: #aab6c4; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #748197; }
    .dot.ok { background: #a9e34b; box-shadow: 0 0 12px #a9e34b88; }
    .dot.error { background: #ff6b6b; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { min-width: 0; border: 1px solid #293544; border-radius: 16px; padding: 20px; background: #171f2a; }
    .card h2 { margin: 0 0 15px; font-size: 16px; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 7px; color: #aab6c4; font-size: 12px; }
    .field input { width: 100%; }
    .bulb-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bulb-list { display: grid; gap: 10px; margin-top: 14px; }
    .bulb { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid #293544; border-radius: 12px; background: #131b25; }
    .bulb-info { min-width: 0; }
    .bulb-ip { font-weight: 650; overflow-wrap: anywhere; }
    .bulb-state { margin-top: 4px; color: #93a1b3; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .actions button { padding: 8px 10px; }
    .empty { padding: 18px 10px; color: #93a1b3; text-align: center; font-size: 14px; }
    .console { grid-column: 1 / -1; }
    .console-output { display: grid; gap: 10px; max-height: 290px; min-height: 100px; overflow: auto; padding: 12px; border: 1px solid #293544; border-radius: 12px; background: #0d1219; }
    .entry { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .entry.command { color: #a9e34b; }
    .entry.error { color: #ff8585; }
    .command-row { display: flex; gap: 9px; margin-top: 10px; }
    .command-row input { flex: 1; }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .quick button { padding: 7px 10px; color: #bdc8d5; font-size: 12px; }
    .notice { color: #8391a4; font-size: 12px; line-height: 1.5; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 22px, 560px); padding-top: 20px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .console { grid-column: auto; }
      .card { padding: 16px; }
      .settings { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
      .connection { padding-top: 10px; white-space: nowrap; }
      .bulb { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">✦</div>
        <div><h1>Yeelight Console</h1><p class="subtitle">Управление лампами в локальной сети</p></div>
      </div>
      <div class="connection" role="status"><span id="status-dot" class="dot"></span><span id="status-text">Проверяем сервер…</span></div>
    </header>
    <div class="grid">
      <section class="card">
        <h2>Подключение</h2>
        <div class="settings">
          <label class="field">Адрес сервера<input id="server-url" type="url" autocomplete="url"></label>
          <label class="field">API-токен (если настроен)<input id="api-token" type="password" autocomplete="current-password"></label>
        </div>
        <p class="notice">Токен сохраняется только до закрытия вкладки. Не передавайте его по недоверенной сети.</p>
      </section>
      <section class="card">
        <div class="bulb-toolbar"><h2 style="margin:0">Мои лампы</h2><button id="discover" type="button">Найти лампы</button></div>
        <div id="bulbs" class="bulb-list"><div class="empty">Загрузка списка…</div></div>
      </section>
      <section class="card console">
        <h2>Командная строка</h2>
        <div id="output" class="console-output" aria-live="polite" aria-label="Вывод команд"></div>
        <form id="command-form" class="command-row">
          <input id="command" autocomplete="off" spellcheck="false" aria-label="Команда" placeholder="Например: discover или on 192.168.1.45">
          <button class="primary" type="submit">Выполнить</button>
        </form>
        <div class="quick" aria-label="Быстрые команды">
          <button type="button" data-command="discover">discover</button>
          <button type="button" data-command="list">list</button>
          <button type="button" data-command="add ">add IP</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const output = $("#output");
    const commandInput = $("#command");
    const bulbsElement = $("#bulbs");
    const tokenInput = $("#api-token");
    const serverInput = $("#server-url");
    const tokenKey = "yeelight-api-token";
    let busy = false;

    serverInput.value = window.location.origin;
    try { tokenInput.value = sessionStorage.getItem(tokenKey) || ""; } catch {}
    tokenInput.addEventListener("input", () => {
      try { sessionStorage.setItem(tokenKey, tokenInput.value); } catch {}
    });

    function log(text, kind = "") {
      const line = document.createElement("div");
      line.className = `entry ${kind}`;
      line.textContent = text;
      output.append(line);
      while (output.children.length > 100) output.firstElementChild.remove();
      output.scrollTop = output.scrollHeight;
    }

    function apiUrl(path) {
      const base = serverInput.value.trim().replace(/\/+$/, "");
      if (!/^https?:\/\/[^/]+$/i.test(base)) throw new Error("Укажите корректный адрес сервера (http:// или https://)");
      return `${base}${path}`;
    }

    async function request(path, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set("X-API-Token", tokenInput.value);
      if (options.body) headers.set("Content-Type", "application/json");
      let response;
      try {
        response = await fetch(apiUrl(path), { ...options, headers });
      } catch (error) {
        throw new Error(`Не удалось связаться с сервером: ${error.message}`);
      }
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `Ошибка HTTP ${response.status}`);
      return body;
    }

    function setConnection(ok, message) {
      $("#status-dot").className = `dot ${ok ? "ok" : "error"}`;
      $("#status-text").textContent = message;
    }

    async function refreshBulbs() {
      const data = await request("/api/bulbs");
      bulbsElement.replaceChildren();
      if (!data.bulbs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Ламп пока нет. Нажмите «Найти лампы» или добавьте адрес через команду add.";
        bulbsElement.append(empty);
        return;
      }
      for (const bulb of data.bulbs) {
        const card = document.createElement("article");
        card.className = "bulb";
        const info = document.createElement("div");
        info.className = "bulb-info";
        const ip = document.createElement("div");
        ip.className = "bulb-ip";
        ip.textContent = bulb.ip;
        const state = document.createElement("div");
        state.className = "bulb-state";
        state.textContent = "Yeelight";
        info.append(ip, state);
        const actions = document.createElement("div");
        actions.className = "actions";
        for (const [label, op] of [["Вкл", "on"], ["Выкл", "off"], ["Статус", "status"]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.addEventListener("click", () => runCommand(`${op} ${bulb.ip}`));
          actions.append(button);
        }
        card.append(info, actions);
        bulbsElement.append(card);
      }
    }

    async function runCommand(text) {
      text = text.trim();
      if (!text || busy) return;
      busy = true;
      const submit = $("#command-form button");
      submit.disabled = true;
      log(`> ${text}`, "command");
      try {
        const data = await request("/api/commands", {
          method: "POST",
          body: JSON.stringify({ command: text })
        });
        log(JSON.stringify(data.result, null, 2));
        setConnection(true, "Сервер подключён");
        if (/^(discover|add|list)\b/.test(text)) {
          try {
            await refreshBulbs();
          } catch (error) {
            log(`Команда выполнена, но список ламп не обновлён: ${error.message}`, "error");
          }
        }
      } catch (error) {
        log(`Ошибка: ${error.message}`, "error");
        setConnection(false, "Нет подключения");
      } finally {
        busy = false;
        submit.disabled = false;
        commandInput.focus();
      }
    }

    $("#command-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = commandInput.value;
      commandInput.value = "";
      runCommand(text);
    });
    $("#discover").addEventListener("click", () => runCommand("discover"));
    document.querySelectorAll("[data-command]").forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.command;
        commandInput.value = value === "add " ? "add " : value;
        commandInput.focus();
        if (value !== "add ") {
          commandInput.value = "";
          runCommand(value);
        }
      });
    });

    (async () => {
      try {
        await request("/api/health");
        setConnection(true, "Сервер подключён");
        await refreshBulbs();
      } catch (error) {
        setConnection(false, "Нет подключения");
        bulbsElement.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = error.message;
        bulbsElement.append(empty);
        log(error.message, "error");
      }
    })();
  </script>
</body>
</html>
