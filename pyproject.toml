[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-app"
version = "0.1.0"
description = "Cross-platform Flet client for Yeelight"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.80,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools]
packages = ["yeelight_app"]
package-dir = { yeelight_app = "." }

[tool.setuptools.package-data]
yeelight_app = ["static/*.html"]
